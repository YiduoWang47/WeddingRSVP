<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page behave properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSVP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fixed full-screen background image. Kept separate from .page so it
         never scrolls, regardless of how tall the form gets. -->
    <div class="background"></div>

    <!-- Everything visible on the page -->
    <main class="page">

        <!-- The scrollable, semi-transparent foreground -->
        <div class="foreground">

            <!-- Decorative cap image, shown once at the top -->
            <img src="static/images/foreground-top.png" alt="" class="foreground-top">
            <!-- Infinitely tileable section: grows to fit however much
                 content (guests) ends up inside it -->
            <div class="foreground-mid">

                <div class="content">

                    <h1>You're Invited</h1>

                    <p class="intro">
                        We would be delighted to have you join us. Please let us
                        know who's coming so we can plan accordingly.
                    </p>

                    <form id="rsvp-form" novalidate>

                        <!-- Guest blocks get inserted here. The first one
                             (you) is added automatically by script.js; every
                             "Add One More Guest" click appends another. -->
                        <div id="guests-container"></div>

                        <button type="button" id="add-guest-btn" class="add-guest-btn">
                            + Add One More Guest
                        </button>

                        <p class="form-error" id="form-error" hidden></p>

                        <button type="submit" id="submit-btn" class="submit-btn">
                            Send RSVP
                        </button>

                    </form>

                    <!-- Shown in place of the form once the RSVP has been sent -->
                    <div class="thank-you" id="thank-you" hidden>
                        <h2>Thank You!</h2>
                        <p>Your RSVP has been received. We can't wait to celebrate with you.</p>
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Template for a single guest's fields. Cloned by script.js for the
         main guest and every added plus-one, so there's one source of
         truth for the markup. -->
    <template id="guest-template">
        <div class="guest">

            <div class="guest-header">
                <h2 class="guest-title">Your Details</h2>
                <button type="button" class="remove-guest-btn" hidden>Remove</button>
            </div>

            <label class="field-label">Full Name</label>
            <input type="text" class="guest-name" placeholder="Full name">

            <div class="event-row">

                <div class="event-field">
                    <label class="field-label">Attending Event One</label>
                    <div class="choice-group" data-part="one">
                        <button type="button" class="choice" data-value="yes">Yes</button>
                        <button type="button" class="choice" data-value="no">No</button>
                    </div>
                </div>

                <div class="event-field">
                    <label class="field-label">Attending Event Two</label>
                    <div class="choice-group" data-part="two">
                        <button type="button" class="choice" data-value="yes">Yes</button>
                        <button type="button" class="choice" data-value="no">No</button>
                    </div>
                </div>

            </div>

            <label class="field-label">Dietary Requirement</label>
            <input type="text" class="guest-dietary" placeholder="e.g. none, vegetarian, gluten-free">

        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
